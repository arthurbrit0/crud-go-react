name: CI/CD

on:
  push:
    branches: [ "main" ]
    paths:
      - 'client/**'
      - 'back-end/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to DockerHub with token
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}  # <-- Em vez de senha, uso de token

      - name: Determine changed folder
        id: changed-folder
        run: |
          if git diff --name-only HEAD HEAD~1 | grep "^client/"; then
            echo "folder=client" >> $GITHUB_OUTPUT
          elif git diff --name-only HEAD HEAD~1 | grep "^back-end/"; then
            echo "folder=back-end" >> $GITHUB_OUTPUT
          else
            echo "folder=none" >> $GITHUB_OUTPUT
          fi

      # ----------- FRONT-END -----------
      - name: Build & push front-end image
        if: steps.changed-folder.outputs.folder == 'client'
        run: |
          COMMIT_TAG=${{ github.sha }}
          REPO="${{ secrets.DOCKERHUB_USERNAME }}/crud-go-react_frontend"
          docker build \
            -t $REPO:latest \
            -t $REPO:${COMMIT_TAG} \
            ./client

          docker push $REPO:latest
          docker push $REPO:${COMMIT_TAG}

      - name: Helm upgrade front-end
        if: steps.changed-folder.outputs.folder == 'client'
        run: |
          helm upgrade --install crud-app ./helm \
            --namespace crud-app \
            --create-namespace \
            --set frontend.image.repository=${{ secrets.DOCKERHUB_USERNAME }}/crud-go-react_frontend \
            --set frontend.image.tag=${{ github.sha }}

      # ----------- BACK-END -----------
      - name: Build & push back-end image
        if: steps.changed-folder.outputs.folder == 'back-end'
        run: |
          COMMIT_TAG=${{ github.sha }}
          REPO="${{ secrets.DOCKERHUB_USERNAME }}/crud-go-react_backend"

          docker build \
            -t $REPO:latest \
            -t $REPO:${COMMIT_TAG} \
            ./back-end

          docker push $REPO:latest
          docker push $REPO:${COMMIT_TAG}

      - name: Helm upgrade back-end
        if: steps.changed-folder.outputs.folder == 'back-end'
        run: |
          helm upgrade --install crud-app ./helm \
            --namespace crud-app \
            --create-namespace \
            --set backend.image.repository=${{ secrets.DOCKERHUB_USERNAME }}/crud-go-react_backend \
            --set backend.image.tag=${{ github.sha }}
