apiVersion: v1
kind: Service
metadata:
  name: front-end-service
  namespace: {{ .Values.namespace }}
  labels:
    app: crud-go-react
    tier: frontend
spec:
  type: {{ .Values.frontend.service.type }}
  selector:
    app: crud-go-react
    tier: frontend
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: {{ .Values.frontend.service.port }}
