version: '3.8'

services:
  frontend:
    build: ./client
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - app-network

  backend:
    build: ./server
    ports:
      - "8081:8081" 
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: go_crud
      DB_PASSWORD: teste
      DB_NAME: postgres
      DB_SSLMODE: disable
    depends_on:
      - db
    volumes:
      - ./server/.env:/app/.env
    networks:
      - app-network

  db:
    image: postgres:13
    restart: always
    environment:
      POSTGRES_USER: go_crud
      POSTGRES_PASSWORD: teste
      POSTGRES_DB: postgres
    ports:
      - "5433:5432" 
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - app-network

volumes:
  db_data:

networks:
  app-network:
    driver: bridge
