apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-deployment
  labels:
    app: crud-go-react
    tier: db
  namespace: crud-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crud-go-react
      tier: db
  template:
    metadata:
      labels:
        app: crud-go-react
        tier: db
    spec:
      containers:
        - name: postgres
          image: postgres:13
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "postgres"
            - name: POSTGRES_USER
              value: "go_crud"
            - name: POSTGRES_PASSWORD
              value: "teste"
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
